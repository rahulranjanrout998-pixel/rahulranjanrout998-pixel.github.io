<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arrow Mania</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a2010">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg1:#1b1146;--bg2:#05030f;--ac:#ffcf4a;--tx:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.on{display:flex}
/* 3D menu */
.scene{perspective:900px;width:100%;height:46%;display:flex;align-items:center;justify-content:center}
.stage{transform-style:preserve-3d;transition:transform .1s;width:0;height:0}
.ring{transform-style:preserve-3d;animation:spin 14s linear infinite}
.ring .c{position:absolute;left:-45px;top:-45px;width:90px;height:90px;transform:rotateY(calc(var(--i)*45deg)) translateZ(190px);filter:drop-shadow(0 8px 6px #0008)}
.ring .c svg{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
@keyframes spin{to{transform:rotateX(-14deg) rotateY(360deg)}}
@keyframes bob{50%{transform:translateY(-10px)}}
h1{margin:6px 0 0;font-size:clamp(34px,10vw,64px);letter-spacing:2px;text-align:center;line-height:1;text-shadow:0 1px 0 #b8860b,0 2px 0 #a67700,0 3px 0 #8a6300,0 4px 0 #6d4e00,0 10px 18px #000a;color:var(--ac);transform:perspective(500px) rotateX(18deg)}
h1 small{display:block;font-size:.32em;color:#fff;letter-spacing:8px;margin-top:6px;text-shadow:0 3px 8px #000}
.btn{font:700 18px system-ui;color:#2a1a00;background:linear-gradient(#ffe27a,#ffb300);border:0;border-radius:14px;padding:14px 34px;margin:8px;box-shadow:0 6px 0 #a56b00,0 12px 18px #0007;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a56b00}
.btn.s{background:linear-gradient(#8fd3ff,#2e8bff);color:#02203f;box-shadow:0 6px 0 #1553a6,0 12px 18px #0007}
.btn.sm{padding:9px 16px;font-size:15px;margin:0}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
input{font:700 18px system-ui;width:120px;padding:11px;border-radius:12px;border:2px solid #6c5ce7;background:#120a30;color:#fff;text-align:center}
.info{opacity:.75;font-size:13px;margin-top:6px}
/* game */
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:8px}
.lv{font-weight:800;font-size:18px;text-align:center}.lv small{display:block;font-weight:500;opacity:.7;font-size:12px}
.hearts{font-size:28px;letter-spacing:3px;min-width:100px;text-align:right;filter:drop-shadow(0 3px 3px #000a)}
.hearts .x{filter:grayscale(1) brightness(.35)}
.hearts .pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6) rotate(-15deg)}}
.pers{perspective:1100px;flex:1;width:100%;display:flex;overflow:auto}
#board{touch-action:none;transition:transform .15s;transform:rotateX(32deg);overflow:visible;margin:auto;flex:none}
.arrow{cursor:pointer}
.arrow .in.bad{animation:shake .45s}
.arrow .in.bad .l,.arrow .in.bad .h{stroke:#ff2638!important;fill:#ff2638}
.arrow .in.bad .l{fill:none}
.arrow .in.bad .sh{stroke:#6b0010!important;fill:#6b0010}
.arrow .in.bad .sh.l{fill:none}
@keyframes shake{20%{transform:translate(-5px,0)}40%{transform:translate(5px,0)}60%{transform:translate(-4px,0)}80%{transform:translate(3px,0)}}
@media(hover:hover){.arrow:hover .in{opacity:.85}}
.arrow.hint .in{animation:hint .6s 3}
@keyframes hint{50%{filter:brightness(2.2) drop-shadow(0 0 8px #fff)}}
.bot{padding:12px;display:flex;gap:10px}
.modal{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9;text-align:center}
.modal.on{display:flex}
.modal h2{font-size:42px;margin:0 0 6px;text-shadow:0 5px 20px #000}
#stars{display:flex;align-items:flex-end;justify-content:center;margin:14px 0 4px}
.st{width:92px;margin:0 -2px;animation:starIn .9s var(--d) cubic-bezier(.2,1.4,.4,1) both}
.st:nth-child(2){width:128px;margin-bottom:26px}
.st path{stroke-width:1.2;stroke-linejoin:round}
.st.on path{fill:#ffd23f;stroke:#ff8f00;filter:drop-shadow(0 0 4px #ffb300)}
.st.on{animation:starIn .9s var(--d) cubic-bezier(.2,1.4,.4,1) both,glow 1.6s calc(var(--d) + 1s) ease-in-out infinite}
.st.off path{fill:#2f2960;stroke:#4a4290}
@keyframes starIn{0%{transform:scale(0) rotate(-540deg);opacity:0}60%{transform:scale(1.7) rotate(25deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glow{50%{transform:scale(1.12) rotate(-4deg);filter:brightness(1.3)}}
#win h2{animation:drop .6s both;font-size:46px;color:#ffd23f}
@keyframes drop{0%{transform:translateY(-80px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
#conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#conf i{position:absolute;width:9px;height:14px;border-radius:2px;opacity:0;animation:burst 1.5s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 220px)) rotate(720deg)}}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 12px;width:100%;max-width:520px;flex:1;overflow:auto;align-content:start}
.card{background:#1a1245;border:2px solid #4a3d9a;border-radius:14px;padding:6px;text-align:center;cursor:pointer;box-shadow:0 6px 0 #0c0828;transform:perspective(500px) rotateX(8deg)}
.card:active{transform:perspective(500px) rotateX(8deg) translateY(4px)}
.card.cur{border-color:#ffcf4a}
.card canvas{width:100%;aspect-ratio:1;background:#24130a;border-radius:8px}
.card small{display:block;font-size:10px;opacity:.8;color:#ffd23f}
#levels .bot input{width:96px;padding:8px}
.screen.on{animation:fade .3s}
@keyframes fade{from{opacity:0}}
@keyframes bin{from{opacity:0;scale:.7;rotate:1 0 0 60deg}}
.pers{touch-action:none;cursor:grab;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.arrow.press .in{opacity:.7}
.bot{flex-wrap:wrap;justify-content:center;gap:6px}
.bot .btn.sm{padding:9px 12px}
#stars{perspective:700px}
.sw{position:relative;margin:0 -2px}
.sw svg{display:block;width:92px;overflow:visible;transform-origin:50% 60%;animation:starDrop 1.3s var(--d) cubic-bezier(.3,.7,.4,1) both}
.sw:nth-child(2){margin-bottom:26px}.sw:nth-child(2) svg{width:128px}
.sw svg.on{filter:drop-shadow(0 8px 5px #000a) drop-shadow(0 0 10px #ffb30099)}
.sw svg.off{filter:drop-shadow(0 6px 4px #000a);opacity:.9}
@keyframes starDrop{
0%{transform:translateY(-340px) scale(2.2) rotateY(0) rotateZ(-30deg);opacity:0}
45%{opacity:1}
52%{transform:translateY(0) scale(1) rotateY(540deg) rotateZ(0)}
62%{transform:translateY(-36px) scale(1.04,.97) rotateY(600deg)}
74%{transform:translateY(0) scale(1.14,.86) rotateY(680deg)}
87%{transform:translateY(-9px) scale(.98,1.03) rotateY(710deg)}
100%{transform:translateY(0) scale(1) rotateY(720deg)}}
.ring2{position:absolute;left:50%;top:55%;width:60px;height:60px;margin:-30px;border-radius:50%;border:3px solid #ffe27a;opacity:0;animation:rg 1s calc(var(--d) + .65s) ease-out both}
@keyframes rg{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(3.4)}}
.shine{animation:sn 3.2s calc(var(--d) + 1.5s) ease-in-out infinite}
@keyframes sn{0%{transform:translateX(-14px)}35%,100%{transform:translateX(36px)}}
.sp{position:absolute;color:#fff8c4;text-shadow:0 0 8px #ffd23f,0 0 14px #ffb300;opacity:0;pointer-events:none;animation:tw 1.8s infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(0) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
#rays{position:absolute;left:50%;top:42%;width:760px;height:760px;margin:-380px 0 0 -380px;z-index:-1;pointer-events:none;
background:repeating-conic-gradient(#ffd23f44 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 68%);mask:radial-gradient(circle,#000 5%,transparent 68%);
animation:rayin 1s .3s both,spin2 18s linear infinite}
@keyframes rayin{from{opacity:0;scale:.3}}
@keyframes spin2{to{rotate:360deg}}
#board{backface-visibility:hidden}
.pers{contain:layout style}
*{-webkit-user-drag:none}
/* ---- cartoon intro ---- */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#5a2fc2,#1b1146 58%,#05030f);overflow:hidden;animation:introOut .6s 5.9s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
#i1,#i2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#i1{animation:ph1 .5s 2.7s forwards}
@keyframes ph1{to{opacity:0;transform:scale(.5) translateY(-60px)}}
.pl{display:flex;justify-content:center;font:900 clamp(32px,9.5vw,54px)/1.05 "Baloo 2","Fredoka One","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:#ffd23f}
.pl span{display:inline-block;white-space:pre;text-shadow:-3px -3px 0 #3b1f7a,3px -3px 0 #3b1f7a,-3px 3px 0 #3b1f7a,3px 3px 0 #3b1f7a,0 3px 0 #3b1f7a,0 8px 0 #1b0f3f;animation:lp .7s calc(var(--base) + var(--i)*.07s) both cubic-bezier(.3,1.7,.5,1),wob 1.6s calc(var(--base) + var(--i)*.1s + .8s) ease-in-out infinite}
@keyframes lp{from{transform:translateY(70px) scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes wob{50%{transform:translateY(-6px) rotate(2deg)}}
.pl.big{font-size:clamp(54px,18vw,100px)}
.pl.big span:nth-child(odd){color:#fff2a8}
#t2b span{color:#ff8fc8}
.pres{color:#fff;font:700 16px system-ui;margin-top:14px;opacity:0;animation:fadein .6s 1.5s forwards}
@keyframes fadein{to{opacity:1}}
.tap2{margin-top:22px;color:#fff;font:800 15px system-ui;letter-spacing:5px;opacity:0;animation:fadein .6s 4.3s forwards}
.skip{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:100%;text-align:center;color:#fff8;font:600 12px system-ui;letter-spacing:2px}
#bun{width:min(58vw,240px);margin-bottom:10px;animation:hop .9s ease-in-out .3s 3,pop2 .6s both;transform-origin:50% 100%;filter:drop-shadow(0 14px 10px #0008)}
@keyframes pop2{from{transform:scale(0) rotate(-20deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.1,.88)}50%{transform:translateY(-38px) scale(.94,1.08)}85%{transform:translateY(0) scale(1.1,.9)}}
.eL{transform-origin:68px 95px;animation:earL .9s ease-in-out infinite}.eR{transform-origin:132px 95px;animation:earR .9s ease-in-out infinite}
@keyframes earL{50%{transform:rotate(-10deg)}}@keyframes earR{50%{transform:rotate(10deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 2.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.hold{transform-origin:168px 160px;animation:wave .6s ease-in-out infinite alternate}
@keyframes wave{to{transform:rotate(10deg)}}
.fa{position:absolute;left:0;width:54px;opacity:0;animation:fly 2.2s var(--d) ease-in-out both;filter:drop-shadow(0 5px 3px #0007)}
@keyframes fly{0%{opacity:1;transform:translateX(-90px) rotate(var(--r))}100%{opacity:1;transform:translateX(calc(100vw + 40px)) rotate(calc(var(--r) + 360deg))}}
#starsbg i{position:absolute;color:#fff6c2;text-shadow:0 0 8px #ffd23f;animation:tw 2s infinite;font-style:normal}
/* ---- 3D icon buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn .ic{width:20px;height:20px;flex:none}
.ic{display:block;width:24px;height:24px;overflow:visible}
.ib{width:44px;height:44px;border:0;border-radius:14px;padding:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#fff;
 background:linear-gradient(#8fd3ff,#2e8bff);box-shadow:0 5px 0 #1553a6,0 9px 12px #0009,inset 0 2px 0 #ffffff99;transition:transform .08s,box-shadow .08s}
.ib::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:10px;border-radius:8px;background:linear-gradient(#ffffff77,#ffffff00);pointer-events:none}
.ib:active{transform:translateY(4px);box-shadow:0 1px 0 #1553a6,0 3px 6px #0009,inset 0 2px 0 #ffffff99}
.ib .ic{width:25px;height:25px;filter:drop-shadow(0 2px 0 #0005)}
.ib.p{background:linear-gradient(#d6a8ff,#8a2be2);box-shadow:0 5px 0 #4a1590,0 9px 12px #0009,inset 0 2px 0 #ffffff99}
.ib.p:active{box-shadow:0 1px 0 #4a1590,0 3px 6px #0009,inset 0 2px 0 #ffffff99}
.ib.o{background:linear-gradient(#ffd08a,#ff7a00);box-shadow:0 5px 0 #a34600,0 9px 12px #0009,inset 0 2px 0 #ffffff99}
.ib.o:active{box-shadow:0 1px 0 #a34600,0 3px 6px #0009,inset 0 2px 0 #ffffff99}
.hintb{width:68px;height:68px;border-radius:50%;margin:0 4px;background:radial-gradient(circle at 35% 25%,#9d8bff,#3a1fb0 55%,#190d58);
 box-shadow:0 7px 0 #0d0640,0 13px 18px #000a,inset 0 3px 0 #ffffff66,0 0 0 3px #ffd23f,0 0 24px #ffd23f88;animation:hintPulse 2.2s ease-in-out infinite}
.hintb::after{left:14px;right:14px;top:5px;height:16px;border-radius:50%}
.hintb:active{box-shadow:0 2px 0 #0d0640,0 4px 8px #000a,inset 0 3px 0 #ffffff66,0 0 0 3px #ffd23f,0 0 24px #ffd23f88}
.hintb .ic{width:46px;height:46px;filter:drop-shadow(0 0 7px #ffd23f)}
.hintb em{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font:800 10px system-ui;letter-spacing:2px;color:#ffd23f;font-style:normal;text-shadow:0 1px 3px #000}
.rays{transform-origin:12px 10px;animation:spin3 9s linear infinite}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes hintPulse{50%{transform:scale(1.07)}}
.hring{fill:none;stroke:#ffe27a;stroke-width:4;transform-box:fill-box;transform-origin:center;animation:hr .75s ease-out 3;pointer-events:none}
@keyframes hr{from{transform:scale(.4);opacity:1}to{transform:scale(3.2);opacity:0}}
.bot{align-items:center;padding-bottom:30px;gap:8px}
.hearts{display:flex;gap:2px;justify-content:flex-end;font-size:0}
.hearts span{display:inline-block}
.hrt{width:30px;height:30px;filter:drop-shadow(0 3px 2px #000a)}
.hrt.on{animation:beat 1.5s infinite}
@keyframes beat{0%,30%,100%{transform:scale(1)}15%{transform:scale(1.15)}}
.bot{flex-wrap:nowrap;gap:5px;padding:10px 6px 30px;justify-content:center}
.ib{width:40px;height:40px;border-radius:12px;flex:none}
.ib .ic{width:22px;height:22px}
.hintb{width:62px;height:62px;margin:0 3px}
.hintb .ic{width:42px;height:42px}
.hintb::after{left:12px;right:12px}
#intro{animation:introOut .6s 7s forwards}
#i1{animation:ph1 .5s 3.9s forwards}
.pl{font-weight:900;font-family:"Arial Black","Impact","Baloo 2","Comic Sans MS",system-ui,sans-serif;letter-spacing:1px}
.pl.hv{font-size:clamp(28px,8.8vw,54px)}
.pl.hv2{font-size:clamp(24px,7.6vw,44px);margin-top:8px}
#t1b span{color:#ff8fc8}
.pl span{text-shadow:-3px -3px 0 #3b1f7a,3px -3px 0 #3b1f7a,-3px 3px 0 #3b1f7a,3px 3px 0 #3b1f7a,0 4px 0 #3b1f7a,0 6px 0 #2a1558,0 9px 0 #1b0f3f,0 14px 14px #0009}
.tap2{animation:fadein .6s 5.7s forwards}
#bun3d{width:min(72vw,300px);height:min(80vw,340px)}
.puff{fill:none;stroke-width:5;transform-box:fill-box;transform-origin:center;animation:pf .55s ease-out forwards;pointer-events:none}
@keyframes pf{from{transform:scale(.3);opacity:1}to{transform:scale(3.2);opacity:0}}
.spk{pointer-events:none;animation:sk .6s ease-out forwards}
@keyframes sk{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@keyframes bshake{20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-4px 0}80%{translate:3px 0}}
#intro~#menu *{animation-play-state:paused!important}
.lite .sh{display:none}
.lite #board{filter:none}
.lite .hintb,.lite .hrt.on,.lite .screen.on{animation:none}
.lite .ib::after{display:none}
.lite .spk{display:none}
/* ===== WOOD THEME ===== */
:root{--grain:none;--grainL:none}
html,body{background:var(--grainL) 0 0/300px 160px,repeating-linear-gradient(90deg,#0000 0 118px,#0000002e 119px 121px),radial-gradient(circle at 50% 30%,#7a4a26,#3a2010 62%,#180c04)}
#intro{background:var(--grainL) 0 0/300px 160px,radial-gradient(circle at 50% 40%,#7a4a26,#3a2010 62%,#180c04)}
.btn{color:#3a1d08;text-shadow:0 1px 0 #ffe3b0aa;border:2px solid #7a4a22;border-radius:14px;
 background:var(--grain) 0 0/200px 110px,repeating-linear-gradient(0deg,#0000 0 5px,#6a3c1816 6px 7px),linear-gradient(#f3c987,#d79a52 55%,#b87a42);
 box-shadow:0 6px 0 #5a3414,0 12px 16px #000a,inset 0 2px 0 #fff0c8aa,inset 0 -4px 8px #6a3c1866}

 box-shadow:0 6px 0 #2a1608,0 12px 16px #000a,inset 0 2px 0 #d9aa7aaa,inset 0 -4px 8px #0006}

.btn.m{color:#ffe9c4;text-shadow:0 -1px 0 #000a;border-color:#4a1a0c;
 background:var(--grainL) 0 0/200px 110px,repeating-linear-gradient(0deg,#0000 0 5px,#00000018 6px 7px),linear-gradient(#d2704a,#a8442a 55%,#7a2f1c);
 box-shadow:0 6px 0 #4a1a0c,0 12px 16px #000a,inset 0 2px 0 #f0a07aaa,inset 0 -4px 8px #0006}

.ib{color:#3a1d08;border:2px solid #7a4a22;
 background:var(--grain) 0 0/160px 90px,repeating-linear-gradient(0deg,#0000 0 4px,#6a3c1816 5px 6px),linear-gradient(#f3c987,#d79a52 55%,#b87a42);
 box-shadow:0 5px 0 #5a3414,0 9px 12px #000a,inset 0 2px 0 #fff0c8aa,inset 0 -3px 6px #6a3c1866}
.ib:active{box-shadow:0 1px 0 #5a3414,0 3px 6px #000a,inset 0 2px 0 #fff0c8aa}
.ib .ic{filter:drop-shadow(0 1px 0 #ffe3b0aa)}

.ib.o{border-color:#4a1a0c;background:var(--grainL) 0 0/160px 90px,repeating-linear-gradient(0deg,#0000 0 4px,#00000018 5px 6px),linear-gradient(#d2704a,#a8442a 55%,#7a2f1c);box-shadow:0 5px 0 #4a1a0c,0 9px 12px #000a,inset 0 2px 0 #f0a07aaa,inset 0 -3px 6px #0006}

 box-shadow:0 7px 0 #2a1608,0 13px 18px #000a,inset 0 3px 0 #ffd9a066,0 0 0 4px #d9a93a,0 0 0 6px #7a5410,0 0 22px #ffd23f66}

<clipPath id="sc"><path d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.5l-6.4 3.6L7 14l-5.3-5 7.2-.9z"/></clipPath>
</defs></svg>
<div class="modal" id="load"><h2>Building board…</h2><div class="info">Packing arrows</div></div>
<script>
const $=id=>document.getElementById(id),BOARD=document.getElementById('board'), C=40, MAXLV=99999;
let mg=false,zoom=1,STARS={},pgTok=0,pg=0;const PER=12;
let level=1, hearts=3, arrows=[], occ=[], W=0, H=0, busy=false;
try{level=+localStorage.getItem('arrowLevel')||1;STARS=JSON.parse(localStorage.getItem('arrowStars')||'{}')}catch(e){}

/* ---------- seeded RNG ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const WOODP=['#e9b97a','#c98b4a','#f0c68a','#b87a42','#d9a05b','#a8693a','#efc58a','#c0884e'];
const PAL=['#ff7a59','#38d9a9','#4dabf7','#da77f2','#ffd43b','#ff8787','#69db7c','#74c0fc','#f783ac','#ffa94d'];

/* ---------- level generator (always solvable) ---------- */
function gen(L){
  const R=rng(L*2654435761>>>0^0x9e3779b9), ri=(a,b)=>a+Math.floor(R()*(b-a+1));
  const MG=L>99999,t=Math.min(1,L/20000),rr=R();let n=Math.min(26,10+Math.floor(Math.sqrt(L)/12));
  if(MG){W=H=85;n=85}else if(rr<.06+.1*t){W=H=45;n=45}else if(rr<.2+.2*t){W=H=32;n=32}else{W=n+ri(-2,4);H=n+ri(-2,4)}
  const shape=ri(0,8), o=ri(0,7), k=ri(2,6), ph=R()*6.28;
  const inside=(x,y)=>{
    let u=(x+.5)/W*2-1, v=(y+.5)/H*2-1, t;
    if(o&1){t=u;u=v;v=t} if(o&2)u=-u; if(o&4)v=-v;
    const r=Math.hypot(u,v);
    switch(shape){
      case 0:return true;
      case 1:return r<=1.05;
      case 2:return Math.abs(u)+Math.abs(v)<=1.1;
      case 3:return r>=.36&&r<=1.08;
      case 4:return Math.abs(u)<.42||Math.abs(v)<.42;
      case 5:return Math.abs(u)<=(v+1)/2+.06;
      case 6:return r<.72+.3*Math.sin(Math.atan2(v,u)*k+ph);
      case 7:return Math.abs(u)<=.28+.75*Math.abs(v);
      default:{const a=u*1.25,b=-v*1.25+.25;return Math.pow(a*a+b*b-1,3)-a*a*b*b*b<=0}
    }
  };
  occ=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>inside(x,y)?-1:-2));
  let free=0;occ.forEach(r=>r.forEach(c=>{if(c==-1)free++}));
  if(free<14){occ=occ.map(r=>r.map(()=>-1));free=W*H}
  const maxLen=Math.min(MG?11:14,3+Math.floor(n/1.6)+Math.floor(L/9000));
  const fillTarget=MG?.995:Math.min(.97,.8+L/150000+n*.002);
  const total=free; arrows=[];let minLen=3;
  const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
  const fn=(x,y)=>{let c=0;for(const[a,b]of DIRS)if(inb(x+a,y+b)&&occ[y+b][x+a]==-1)c++;return c};
  function tryPlace(hx,hy,d){
    const [dx,dy]=DIRS[d];let ok=true;const ray=new Set();
    for(let x=hx+dx,y=hy+dy;inb(x,y);x+=dx,y+=dy){ if(occ[y][x]>=0)return false; ray.add(x+','+y) }
    const nx=hx-dx,ny=hy-dy; if(!inb(nx,ny)||occ[ny][nx]!=-1)return false;
    const path=[[hx,hy],[nx,ny]],seen=new Set([hx+','+hy,nx+','+ny]);
    const len=ri(minLen,maxLen); let cx=nx,cy=ny,lastD=-1;
    while(path.length<len){
      const opts=[];
      for(let q=0;q<4;q++){const x=cx+DIRS[q][0],y=cy+DIRS[q][1],key=x+','+y;
        if(inb(x,y)&&occ[y][x]==-1&&!seen.has(key)&&!ray.has(key))opts.push(q)}
      if(!opts.length)break;
      let q;
      if(R()<.6){let b=9;for(const o of opts){const c=fn(cx+DIRS[o][0],cy+DIRS[o][1]);if(c<b){b=c;q=o}}}
      else q=(lastD>=0&&opts.includes(lastD)&&R()<.5)?lastD:opts[ri(0,opts.length-1)];
      cx+=DIRS[q][0];cy+=DIRS[q][1];lastD=q;path.push([cx,cy]);seen.add(cx+','+cy);
    }
    const id=arrows.length;
    path.forEach(([x,y])=>occ[y][x]=id);free-=path.length;
    arrows.push({id,path,d,alive:true,col:PAL[ri(0,PAL.length-1)]});
    return true;
  }
  // sweep cells from the centre outwards (with jitter) so every new arrow can leave the board
  const cand=[];const jit=.3*Math.max(W,H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(occ[y][x]==-1)cand.push([x,y,Math.hypot(x-W/2,y-H/2)+R()*jit]);
  cand.sort((a,b)=>a[2]-b[2]);
  for(let pass=0;pass<(MG?8:4)&&free>total*(1-fillTarget);pass++){minLen=pass>1?2:3;
    for(const[hx,hy]of cand){
      if(occ[hy][hx]!=-1)continue;
      const od=[0,1,2,3].sort(()=>R()-.5);
      for(const d of od)if(tryPlace(hx,hy,d))break;
    }
  }
  arrows.forEach(a=>a.ray=null);
  return {shape};
}

/* ---------- rendering ---------- */
const NS='http://www.w3.org/2000/svg';
function el(t,at,p){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function shade(hex,f){const n=parseInt(hex.slice(1),16);return'#'+[16,8,0].map(s=>Math.max(0,Math.min(255,Math.round(((n>>s)&255)*f))).toString(16).padStart(2,'0')).join('')}
function draw(){
  const b=$('board');b.innerHTML='';
  b.setAttribute('viewBox',`-10 -10 ${W*C+20} ${H*C+30}`);
  if(W>45)b.setAttribute('shape-rendering','optimizeSpeed');else b.removeAttribute('shape-rendering');
  sizeBoard();
  b.style.backgroundImage='none';
  const par=b.parentNode;par.removeChild(b);
  paintFloor(b);
  arrows.forEach(a=>{
    const g=el('g',{class:'arrow'},b),inn=el('g',{class:'in'},g);a.g=g;a.in=inn;a.mv=0;
    const [dx,dy]=DIRS[a.d],n=a.path.length;a.N=Math.max(W,H)+n+2;
    a.full=a.path.slice().reverse().map(([x,y])=>[x*C+C/2,y*C+C/2]);
    const hd=a.full[n-1];for(let i=1;i<=a.N+1;i++)a.full.push([hd[0]+dx*i*C,hd[1]+dy*i*C]);
    a.ls=[];a.hs=[];
    a.hit=el('polyline',{points:a.path.map(([x,y])=>(x*C+C/2)+','+(y*C+C/2)).join(' '),fill:'none',stroke:'transparent','stroke-width':hitW(),'stroke-linecap':'round','stroke-linejoin':'round','pointer-events':'stroke'},g);
    [[5,.45],[0,1]].forEach(([off,f],k)=>{const col=shade(a.col,f),cl=k?'':' sh';
      a.ls.push(el('polyline',{fill:'none',stroke:col,'stroke-width':13,'stroke-linecap':'round','stroke-linejoin':'round',class:'l'+cl},inn));
      a.hs.push(el('polygon',{fill:col,stroke:col,'stroke-width':3,'stroke-linejoin':'round',class:'h'+cl},inn));});
    setSnake(a,0);
    g.__a=a;
  });
  par.appendChild(b);
}
/* snake motion: body follows its own path, s = cells travelled */
function setSnake(a,s){
  const n=a.path.length,P=a.full,h=n-1+s,at=q=>{const i=Math.min(Math.floor(q),P.length-2),f=q-i;return[P[i][0]+(P[i+1][0]-P[i][0])*f,P[i][1]+(P[i+1][1]-P[i][1])*f]};
  const pts=[at(s)];for(let i=Math.floor(s)+1;i<h;i++)pts.push(P[i]);pts.push(at(h));
  const [dx,dy]=DIRS[a.d],px=-dy,py=dx;
  const Lf=a.lift||0;[5+Lf*10,-Lf*3].forEach((off,k)=>{
    a.ls[k].setAttribute('points',pts.map(p=>p[0]+','+(p[1]+off)).join(' '));
    const e=pts[pts.length-1],cx=e[0],cy=e[1]+off;
    a.hs[k].setAttribute('points',`${cx+dx*17},${cy+dy*17} ${cx-dx*3+px*12},${cy-dy*3+py*12} ${cx-dx*3-px*12},${cy-dy*3-py*12}`);
  });
}
const ANIMS=[];let looping=false,lastF=0,fa=0,fn=0;
function loop(now){
  if(lastF){const dt=now-lastF;if(dt<200){fa+=dt;fn++;if(fn>=40){if(fa/fn>28)document.body.classList.add('lite');fa=0;fn=0}}}lastF=now;
  for(let i=ANIMS.length-1;i>=0;i--){const m=ANIMS[i],k=Math.max(0,Math.min(1,(now-m.t0)/m.dur)),e=m.lift?k*(.35+.65*k):k*k*(3-2*k);
    m.a.lift=m.lift?Math.min(1,k*8):0;setSnake(m.a,m.from+(m.to-m.from)*e);if(k>=1){ANIMS.splice(i,1);m.cb&&m.cb()}}
  if(ANIMS.length)requestAnimationFrame(loop);else{looping=false;lastF=0}
}
function anim(a,from,to,dur,cb,lift){ANIMS.push({a,from,to,dur,cb,lift,t0:performance.now()});if(!looping){looping=true;requestAnimationFrame(loop)}}
/* sound + haptics */
let muted=false,AC;
function snd(f,d,type,v,sl){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)({latencyHint:'balanced'});const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime((v||.07)*1.6,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
/* static floor + wooden tray: painted once on a canvas and used as the board's background
   (thousands of SVG tile shapes were the main cause of lag on big boards) */
let floorTok=0,floorURL='';
function paintFloor(svg){
  const fw=W*C,fh=H*C,vw=fw+20,vh=fh+30,k=Math.min(1,2000/Math.max(vw,vh)),cv=document.createElement('canvas');
  cv.width=Math.ceil(vw*k);cv.height=Math.ceil(vh*k);
  const g=cv.getContext('2d');g.scale(k,k);g.translate(10,10);
  const rr=(x,y,w,h,r)=>{g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)};
  const gr=g.createLinearGradient(0,-9,0,fh+17);gr.addColorStop(0,'#c48248');gr.addColorStop(1,'#7a4a26');
  g.beginPath();rr(-9,-9,fw+18,fh+26,12);g.fillStyle=gr;g.fill();
  g.save();g.clip();g.strokeStyle='rgba(107,58,20,.32)';g.lineWidth=1.2;
  for(let y=-9;y<fh+17;y+=9){g.beginPath();for(let x=-9;x<=fw+9;x+=12)g.lineTo(x,y+Math.sin(x*.045+y*1.7)*2.6);g.stroke()}
  g.restore();
  g.lineWidth=3;g.strokeStyle='#2a1608';g.beginPath();rr(-9,-9,fw+18,fh+26,12);g.stroke();
  g.fillStyle='#1a0d05';g.beginPath();rr(-2,-2,fw+4,fh+12,6);g.fill();
  let sh=new Path2D(),top=new Path2D(),dots=new Path2D();
  const add=(p,x,y,w,h,r)=>{if(p.roundRect)p.roundRect(x,y,w,h,r);else p.rect(x,y,w,h)};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(occ[y][x]!=-2){
    add(sh,x*C+2,y*C+7,C-4,C-4,6);add(top,x*C+2,y*C+2,C-4,C-4,6);dots.rect(x*C+C/2-1.5,y*C+C/2-1.5,3,3);
  }
  g.fillStyle='#24130a';g.fill(sh);g.fillStyle='#5b3b22';g.fill(top);g.fillStyle='#8a6240';g.fill(dots);
  [[-5.5,-5.5],[fw+5.5,-5.5],[-5.5,fh+13.5],[fw+5.5,fh+13.5]].forEach(([x,y])=>{
    g.beginPath();g.arc(x,y,3,0,6.283);g.fillStyle='#d9a93a';g.fill();g.lineWidth=1;g.strokeStyle='#7a5410';g.stroke();
    g.beginPath();g.arc(x-.8,y-.8,1,0,6.283);g.fillStyle='#fff3b0';g.fill()});
  const tok=++floorTok;
  cv.toBlob(bl=>{if(!bl||tok!==floorTok)return;const u=URL.createObjectURL(bl);if(floorURL)URL.revokeObjectURL(floorURL);floorURL=u;svg.style.backgroundImage='url('+u+')'},'image/png');
}
function sizeBoard(){
  const b=$('board'),base=Math.min(innerWidth*.94,(innerHeight-190)*.95*W/H,innerHeight*.62*W/H),sz=Math.max(base,W>60?W*16:W>20?W*11:0)*zoom;

/* ---------- pleasant sound engine (FM bells, whooshes, boings) ---------- */
let SB,combo=0,lastOk=0,introRun=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'balanced'});setTimeout(prewarm,400)}if(AC.state==='suspended')AC.resume();return AC}
function prewarm(){try{[.25,.3,.4,.5,.7].forEach(d=>{if(NBC[d])return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);NBC[d]=b})}catch(e){}}
let MS;
function master(){if(!MS){MS=AC.createDynamicsCompressor();MS.threshold.value=-3;MS.knee.value=4;MS.ratio.value=10;MS.attack.value=.003;MS.release.value=.25;MS.connect(AC.destination)}return MS}
const NBC={};
function bus(){ac();if(!SB){SB=AC.createGain();SB.gain.value=1;SB.connect(master())}return SB}
function bellAt(f,t,d,v,dest){
  t=Math.max(t,AC.currentTime+.005);
  [[1,1,1],[2,.3,.55],[3.01,.1,.3]].forEach(([r,a,dm])=>{if(f*r>6500)return;
    const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*r;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d*dm);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d*dm+.05)})
}
function bell(f,d,v,when){if(muted)return;try{bellAt(f,ac().currentTime+(when||0),d||1,v||.14,bus())}catch(e){}}
function noise(d,f0,f1,v){if(muted)return;try{const a=ac();let buf=NBC[d];
  if(!buf){const n=a.sampleRate*d|0;buf=NBC[d]=a.createBuffer(1,n,a.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n)}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;bp.type='bandpass';bp.Q.value=1.1;
  bp.frequency.setValueAtTime(f0,a.currentTime);bp.frequency.exponentialRampToValueAtTime(f1,a.currentTime+d);g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(bus());s.start()}catch(e){}}
function slide(f0,f1,d,v,mid){if(muted)return;try{const a=ac(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(f0,t);if(mid)o.frequency.exponentialRampToValueAtTime(mid,t+d*.3);o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus());o.start(t);o.stop(t+d+.02)}catch(e){}}
const boing=()=>slide(220,330,.32,.22,620);
const PNT=[0,2,4,7,9,12,14,16,19,21];
function tapOk(){const n=performance.now();combo=n-lastOk<1400?Math.min(combo+1,PNT.length-1):0;lastOk=n;
  bell(523.25*Math.pow(2,PNT[combo]/12),.9,.17);noise(.25,500,2600,.025)}
function bonk(){combo=0;slide(240,100,.28,.25);bell(147,.5,.1)}
function ready(){bell(659.25,.6,.1);bell(880,.7,.1,.08);noise(.3,300,1800,.02)}
function starSound(i){const f=[784,988,1175][i];bell(f,1.6,.2);bell(f*2,1.2,.08,.04);noise(.4,800,4000,.02)}
function winJingle(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,1.4,.13,i*.09))}
addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button'))bell(1046.5,.14,.07)});
function introSound(run){
  const at=(ms,fn)=>setTimeout(()=>{if(run===introRun&&$('intro')&&AC&&AC.state==='running')fn()},ms);
  for(let k=1;k<=4;k++)at(900*k+60,boing);
  for(let i=0;i<12;i++)at(700+i*70,()=>bell(600+i*45,.2,.09));
  for(let i=0;i<10;i++)at(1700+i*70,()=>bell(900+i*40,.2,.08));
  at(3900,()=>noise(.5,300,3000,.035));
  [4300,4700,5100].forEach(m=>at(m,()=>noise(.7,300,2500,.03)));
  for(let i=0;i<5;i++)at(4200+i*70,()=>bell(500+i*70,.2,.1));
  for(let i=0;i<5;i++)at(4600+i*70,()=>bell(700+i*70,.2,.1));
  [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>at(5200+i*110,()=>bell(f,1.6,.16)));
  at(5700,()=>{bell(2093,1.8,.07);bell(1568,2,.07,.1)});
}
/* ---------- wood grain textures, painted once to bitmaps ---------- */
function makeGrain(w,h,rgb,amax,seed){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),d=im.data;
  let r=seed;const rnd=()=>(r=(r*16807)%2147483647)/2147483647;
  const ph=[rnd(),rnd(),rnd(),rnd()],rowN=Array.from({length:h},()=>rnd()),kx=w*(.3+.4*rnd()),ky=h*(.3+.4*rnd());
  for(let y=0;y<h;y++){
    const v=.5+.5*(Math.sin(6.283*(3*y/h+ph[0]))*.45+Math.sin(6.283*(7*y/h+ph[1]))*.3+Math.sin(6.283*(19*y/h+ph[2]))*.15)+(rowN[y]-.5)*.5;
    for(let X=0;X<w;X++){
      const wob=Math.sin(6.283*(2*X/w+ph[3]+3*y/h))*.12;
      let a=Math.max(0,Math.min(1,(v+wob-.5)*2.2));
      const dk=Math.hypot((X-kx)/(w*.09),(y-ky)/(h*.16));
      if(dk<1.6)a=Math.max(a,(1-dk/1.6)*(.5+.5*Math.sin(dk*18)));
      const i=(y*w+X)*4;d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2];d[i+3]=a*amax*255;
    }}
  x.putImageData(im,0,0);return c.toDataURL('image/png');
}
try{const rs=document.documentElement.style;
  rs.setProperty('--grain','url('+makeGrain(256,128,[92,52,20],.6,12345)+')');

(function(){
  const mk=(id,t)=>{$(id).innerHTML=[...t].map((c,i)=>`<span style="--i:${i}" data-c="${c}">${c}</span>`).join('')};
  mk('m1','ARROW');mk('m2','MANIA');mk('t1','BUNNY STUDIO');mk('t1b','INTRODUCES');mk('t2a','ARROW');mk('t2b','MANIA');
  let sb='';for(let i=0;i<22;i++)sb+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;font-size:${8+Math.random()*16}px;animation-delay:${Math.random()*2}s">✦</i>`;
  $('starsbg').innerHTML=sb;
  const it=$('intro');
  it.addEventListener('animationend',e=>{if(e.animationName==='introOut'){it.remove();musicStart()}});
  const skip=it.querySelector('.skip');let started=false;
  const begin=()=>{started=true;skip.textContent='tap to skip';skip.style.animation='none';
    it.style.display='none';void it.offsetWidth;it.style.display='';window.bunnyReset&&bunnyReset();introSound(++introRun)};
  try{ac()}catch(e){}
  setTimeout(()=>{if(!$('intro'))return;if(AC&&AC.state==='running'){started=true;introSound(++introRun)}
    else{skip.textContent='🔊 TAP TO START WITH SOUND';skip.style.animation='hintPulse 1.4s ease-in-out infinite'}},120);
  it.addEventListener('pointerdown',()=>{
    try{ac()}catch(e){}
    if(!started){const go=()=>{if(started)return;begin()};AC&&AC.resume?AC.resume().then(go,go):go();return}
    it.style.transition='opacity .3s';it.style.opacity=0;setTimeout(()=>it.remove(),320)});
})();
